version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pi:
        patterns:
          - "@earendil-works/pi-*"
      compatible-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/pi-*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)
