version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Keep declarations aligned with the newest supported Node runtime (24).
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      pi:
        patterns:
          - "@earendil-works/pi-*"
      compatible-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/pi-*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)
