name: Update Antigravity runtime manifest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: antigravity-runtime-manifest
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'zacbemis'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Read and verify official release artifacts
        run: node scripts/refresh-runtime-manifest.mjs
      - name: Sign changed manifest
        if: ${{ hashFiles('runtime-manifest.json') != '' }}
        env:
          RUNTIME_MANIFEST_PRIVATE_KEY: ${{ secrets.ACP_RUNTIME_MANIFEST_PRIVATE_KEY }}
        run: |
          if git diff --quiet -- runtime-manifest.json; then
            echo "The signed manifest is already current."
            exit 0
          fi
          if [ -z "$RUNTIME_MANIFEST_PRIVATE_KEY" ]; then
            echo "ACP_RUNTIME_MANIFEST_PRIVATE_KEY is required to publish a runtime update." >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/runtime-manifest-private.pem"
          printf '%s\n' "$RUNTIME_MANIFEST_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ACP_RUNTIME_MANIFEST_PRIVATE_KEY_PATH="$key_file" npm run sign:runtime-manifest
          npx vitest run test/runtime-manifest.test.ts
      - name: Publish signed manifest
        run: |
          if git diff --quiet -- runtime-manifest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-manifest.json
          git commit -m "chore: approve latest Antigravity ACP runtime"
          git push
